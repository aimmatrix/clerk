name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Test core
        run: pnpm --filter @clerk/core test

      - name: Typecheck core
        run: pnpm --filter @clerk/core exec tsc --noEmit

      - name: Typecheck web
        run: pnpm --filter web exec tsc --noEmit

      - name: Typecheck bot
        run: pnpm --filter bot exec tsc --noEmit

      - name: Approval gate
        run: pnpm exec tsx --test e2e/approval-gate.test.ts

      - name: Smoke
        run: pnpm smoke
